  <!DOCTYPE html>
  <html>
  <head>
      <title>RDRS Deployment Security Status</title>
      <style>body { font-family: monospace; background: #0f141c; color: #76e38c; padding: 5%; }</style>
  </head>
  <body>
      <div class="header">
                <h1>🛡️ RDRS Cloud Monitoring Matrix Node</h1>
                <span style="background-color: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #a855f7; font-weight: bold; border: 1px solid #4c1d95;">SIMULATION MATRIX MODE</span>
      </div>

      <div class="status-card">
                 <div id="view">Awaiting status data matrix...</div>
                <div class="stat">
                    <span class="stat-lbl">Calculated Metric Risk</span>
                    <span class="stat-val" style="color: {level_color};">{risk:.1f} / 100</span>
                </div>
                <div class="stat">
                    <span class="stat-lbl">Evaluated Threat Level</span>
                    <span class="stat-val" style="color: {level_color};">{level}</span>
                </div>
            </div>
      <script>
          fetch('./dashboard_data.json')
              .then(res => res.json())
              .then(data => {
                  document.getElementById('view').innerHTML = `
                      <p><b>Last Status Synchronization:</b> ${data.last_updated}</p>
                      <p><b>Total Sandbox Operations Logged:</b> ${data.total_events}</p>
                      <h3>Recent System Alert Logs</h3>
                      <ul>${data.alerts.length ? data.alerts.map(a => `<li>[Score: \${a.score}] Process: \({a.process} -\){a.desc}</li>`).join('') : '<li>No active alerts recorded.</li>'}</ul>
                  `;
              }).catch(e => { document.getElementById('view').innerText = "Telemetry dataset payload unavailable."; });
      </script>
  </body>
  </html>
