name: Python application

on:
  workflow_dispatch: # Enables the manual trigger button 

  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.10.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Install requirements
      run: |
         pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: run RDRS Program in the bcakground
      run: |
           Start-Job -ScriptBlock { & "python -m app.main" }
    - name: Test with pytest
      run: |
       python -m pytest tests/test_rdrs.py
    - name: Modify index.html using Commit and push via git
      shell: powershell
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add index.html
          
          # Check if there are changes staged for commit
          git diff --quiet --staged
          if ($LASTEXITCODE -ne 0) {
              git commit -m "Update index.html"
              git push
          } else {
              Write-Output "No changes to commit."
          }
