name: RDRS Telemetry and GitHub Pages Deployment Pipeline 

on:
  push:
    branches: [ main ]
  schedule:
    # Automatically triggers a telemetry refresh every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows you to manually trigger the dashboard generation from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-build:
    name: Run Telemetry Suite and Compile Static Assets
    runs-on: self-hosted
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Development Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
   
    - name: Deploy Static Webpage Assets to GitHub Pages Branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: .
    - name: publish to main
      run: |
        git config --global hanumantaraoa.hanumantaraoa@gmail.com
        git config --global hanumantaraoa.hanumantaraoa "Your Name"
        git add .
        git commit -m "Add local documentation build"
        git push origin main
