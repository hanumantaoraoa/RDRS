name: Python Code Pruning and Testing

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'data/**'
      - 'tests/**'
      - '**.py'          # Watches all Python files for changes
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'data/**'
      - 'tests/**'
      - '**.py'

jobs:
  prune-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff black

    - name: Code Formatting & Pruning Check (Black)
      run: black --check .

    - name: Code Linting & Dead-code Check (Ruff)
      run: ruff check .

    - name: Run Pytest Suite
      run: |
        pytest tests/
