name: Update Changed Files with Community Action

on:
  push:
    branches: [ main ]

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Modify Files
        run: |
          echo "Automated change" >> logs.txt

      - name: Auto-Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated file update"
