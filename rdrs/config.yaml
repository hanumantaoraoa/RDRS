system:
  monitored_directory: "./rdrs/data/sandbox"
  quarantine_directory: "./rdrs/data/quarantine"
  database_url: "sqlite:///./rdrs/data/rdrs.db"
  log_dir: "./rdrs/logs/"

analysis:
  window_seconds: 10
  high_entropy_threshold: 6.5
  max_events_per_window: 20

weights:
  file_create: 5
  file_modify: 10
  file_delete: 15
  file_rename: 15
  high_entropy: 30
  rapid_activity: 25

api:
  host: "127.0.0.1"
  port: 9000
